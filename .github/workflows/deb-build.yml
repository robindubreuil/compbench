name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Build with gcc -fanalyzer
        run: make CFLAGS="-Wall -Wextra -Werror -O2 -fanalyzer"

  # test.sh rebuilds from clean; the sanitizer flags travel through the
  # environment (the Makefile's ?= keeps them). Every test.sh assertion
  # then runs against the instrumented binary.
  sanitize:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make btrfs-progs xz-utils gdisk curl

      - name: Run Tests under ASan/UBSan
        run: |
          sudo \
            CFLAGS="-O2 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined" \
            bash test.sh

  test-ubuntu-24-04:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make btrfs-progs xz-utils gdisk curl

      - name: Run Tests
        run: sudo bash test.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - debarch: amd64
            platform: linux/amd64
          - debarch: i386
            platform: linux/386
          - debarch: arm64
            platform: linux/arm64
          - debarch: armhf
            platform: linux/arm/v7
          - debarch: armel
            platform: linux/arm/v5

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # All architectures build on the same Debian baseline so the
      # produced packages share one toolchain and hardening set.
      # trixie = current stable, matching debian/changelog's
      # Standards-Version 4.7.2-era policy; bookworm publishes no
      # linux/arm/v5 image, so armel cannot build there at all.
      - name: Build Debian Package (${{ matrix.debarch }})
        run: |
          # qemu-user/i386 (socketcall) can mangle glibc's parallel
          # A/AAAA DNS batch: force sequential lookups, and bypass the
          # runner's own resolver. Harmless for the other arches.
          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\noptions single-request\n' > /tmp/resolv.ci.conf
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            -v /tmp/resolv.ci.conf:/etc/resolv.conf \
            debian:trixie \
            bash -c '
              set -e
              # Emulated containers sometimes hit transient DNS failures
              # on hosted runners, and apt-get update exits 0 on partial
              # errors by default — hard-fail and retry instead.
              n=0
              until apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=5 update; do
                n=$((n+1))
                if [ "$n" -ge 3 ]; then exit 1; fi
                sleep 5
              done
              apt-get install -y -o Acquire::Retries=5 dpkg-dev debhelper build-essential fakeroot gcc make
              dpkg-buildpackage -us -uc
              mv ../compbench_*.deb ./
            '

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v5
        with:
          name: compbench-deb-${{ matrix.debarch }}
          path: compbench_*.deb

  # Lint the package produced by the same baseline image as the build
  # matrix (trixie's lintian knows Standards-Version 4.7.2; bookworm's
  # caps at 4.6.2 and fails on the newer-standards-version warning).
  # dpkg-buildpackage writes its artifacts one level above the source
  # tree (= / inside the container).
  lintian:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Package and Run Lintian
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            debian:trixie \
            bash -c '
              set -e
              n=0
              until apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=5 update; do
                n=$((n+1))
                if [ "$n" -ge 3 ]; then exit 1; fi
                sleep 5
              done
              apt-get install -y -o Acquire::Retries=5 dpkg-dev debhelper build-essential fakeroot gcc make lintian
              dpkg-buildpackage -us -uc
              lintian --fail-on error,warning /compbench_*.changes
            '
