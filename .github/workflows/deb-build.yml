name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Build with gcc -fanalyzer
        run: make CFLAGS="-Wall -Wextra -Werror -O2 -fanalyzer"

  test-ubuntu-24-04:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make btrfs-progs xz-utils gdisk curl

      - name: Run Tests
        run: sudo bash test.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - debarch: amd64
            platform: linux/amd64
          - debarch: i386
            platform: linux/386
          - debarch: arm64
            platform: linux/arm64
          - debarch: armhf
            platform: linux/arm/v7
          - debarch: armel
            platform: linux/arm/v5

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # All architectures build on the same Debian baseline so the
      # produced packages share one toolchain and hardening set.
      - name: Build Debian Package (${{ matrix.debarch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/src" -w /src \
            debian:bookworm \
            bash -c "
              set -e
              apt-get update
              apt-get install -y dpkg-dev debhelper build-essential fakeroot gcc make
              dpkg-buildpackage -us -uc
              mv ../compbench_*.deb ./
            "

      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v5
        with:
          name: compbench-deb-${{ matrix.debarch }}
          path: compbench_*.deb
